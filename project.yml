# Xcode project for the signed builds (iPad, and the Mac build that shares its iCloud container).
# Regenerate with `xcodegen`. `build.sh` still makes the quick ad-hoc Mac build from Package.swift.
name: Folio
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: VLZY44ZX2X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.voz.folio
    PRODUCT_NAME: Folio
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Folio-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/Folio
      - Support/Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Support/Folio-iOS.entitlements
  Folio-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/Folio
      - Support/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Folio-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: NO
